        --sub-on-btn:  #5c5c57;  /* 淡グリーン上：5.30:1 */

        object-fit: cover;

      .avatar-wrap::after {

        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, rgba(250, 246, 238, 0) 58%, rgba(250, 246, 238, 0.85) 100%);

        text-decoration: none;
        color: var(--text);
        background: var(--green);
        transition: transform 0.25s ease, filter 0.25s ease;

      .btn:hover {

        filter: brightness(0.975);
      }
      .btn-title {

        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: 0.06em;
